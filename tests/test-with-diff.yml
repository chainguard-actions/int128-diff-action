name: Test with diff (different base and head)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create base and head directories with different content
        run: |
          mkdir -p /tmp/diff-base /tmp/diff-head
          echo "original content" > /tmp/diff-base/file.txt
          echo "modified content" > /tmp/diff-head/file.txt

      - id: action
        uses: .
        with:
          base: /tmp/diff-base
          head: /tmp/diff-head

      - name: Assert comment-body is non-empty when diff exists
        env:
          ACTUAL: ${{ steps.action.outputs.comment-body }}
        run: |
          echo "actual: '$ACTUAL'"
          NORM="$(echo "$ACTUAL" | tr -d '[:space:]')"
          if [ -z "$NORM" ] || [ "$NORM" = "{}" ] || [ "$NORM" = "null" ] \
             || echo "$ACTUAL" | grep -qiE 'no .*(change|diff)'; then
            echo "FAIL: expected a diff in comment-body but got empty/no-diff: $ACTUAL"
            exit 1
          fi
          echo "PASS: comment-body contains diff content"
