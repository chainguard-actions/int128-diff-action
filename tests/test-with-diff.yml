name: Test with diff scenario
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create base and head directories with different content
        run: |
          mkdir -p /tmp/base-diff /tmp/head-diff
          echo "old content" > /tmp/base-diff/file.txt
          echo "new content" > /tmp/head-diff/file.txt

      - id: action
        uses: .
        with:
          base: /tmp/base-diff
          head: /tmp/head-diff

      - name: Assert comment-body is non-empty when diff exists
        env:
          ACTUAL: ${{ steps.action.outputs.comment-body }}
        run: |
          echo "actual: '$ACTUAL'"
          NORM="$(echo "$ACTUAL" | tr -d '[:space:]')"
          if [ -z "$NORM" ] || [ "$NORM" = "{}" ] || [ "$NORM" = "null" ] \
             || echo "$ACTUAL" | grep -qiE 'no .*(change|diff)'; then
            echo "FAIL: expected a diff but got empty/no-diff: $ACTUAL"
            exit 1
          fi
          echo "PASS: diff present in comment-body"

      - name: Assert comment-body contains diff markers
        env:
          ACTUAL: ${{ steps.action.outputs.comment-body }}
        run: |
          echo "actual: '$ACTUAL'"
          if echo "$ACTUAL" | grep -q "file.txt"; then
            echo "PASS: comment-body references the changed file"
          else
            echo "FAIL: expected comment-body to reference file.txt"
            exit 1
          fi
