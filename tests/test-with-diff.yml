name: Test with diff (modified file)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create base and head directories with a modified file
        run: |
          mkdir -p /tmp/base-modified /tmp/head-modified
          echo "original content" > /tmp/base-modified/app.txt
          echo "updated content" > /tmp/head-modified/app.txt

      - id: diff
        uses: .
        with:
          base: /tmp/base-modified
          head: /tmp/head-modified

      - name: Assert comment-body contains diff info
        env:
          ACTUAL: ${{ steps.diff.outputs.comment-body }}
        run: |
          echo "actual: '$ACTUAL'"
          NORM="$(echo "$ACTUAL" | tr -d '[:space:]')"
          if [ -z "$NORM" ] || [ "$NORM" = "{}" ] || [ "$NORM" = "null" ] \
             || echo "$ACTUAL" | grep -qiE 'no .*(change|diff)'; then
            echo "FAIL: expected a diff but got empty/no-diff: $ACTUAL"
            exit 1
          fi
          # The comment should mention "file changed" or "files changed"
          if echo "$ACTUAL" | grep -qiE 'file.* changed'; then
            echo "PASS: comment-body contains diff info"
          else
            echo "FAIL: comment-body does not mention 'file changed': $ACTUAL"
            exit 1
          fi
