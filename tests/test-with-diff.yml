name: Test with diff (files differ)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create differing base and head files
        run: |
          mkdir -p /tmp/diff-test-changed/base /tmp/diff-test-changed/head
          echo "original content" > /tmp/diff-test-changed/base/file.txt
          echo "modified content" > /tmp/diff-test-changed/head/file.txt

      - id: action
        uses: .
        with:
          base: /tmp/diff-test-changed/base
          head: /tmp/diff-test-changed/head

      - name: Assert comment-body is non-empty when diff exists
        env:
          ACTUAL: ${{ steps.action.outputs.comment-body }}
        run: |
          echo "actual: '$ACTUAL'"
          NORM="$(echo "$ACTUAL" | tr -d '[:space:]')"
          if [ -z "$NORM" ] || [ "$NORM" = "{}" ] || [ "$NORM" = "null" ] \
             || echo "$ACTUAL" | grep -qiE 'no .*(change|diff)'; then
            echo "FAIL: expected a diff in comment-body but got empty/no-diff: $ACTUAL"
            exit 1
          fi
          echo "PASS: comment-body contains diff content"

      - name: Assert comment-body contains file changed summary
        env:
          ACTUAL: ${{ steps.action.outputs.comment-body }}
        run: |
          echo "actual: '$ACTUAL'"
          if echo "$ACTUAL" | grep -q "file"; then
            echo "PASS: comment-body mentions file changes"
          else
            echo "FAIL: comment-body does not mention file changes"
            exit 1
          fi

      - name: Assert comment-body contains modified marker
        env:
          ACTUAL: ${{ steps.action.outputs.comment-body }}
        run: |
          echo "actual: '$ACTUAL'"
          if echo "$ACTUAL" | grep -qE '(modified|changed|file\.txt)'; then
            echo "PASS: comment-body contains expected diff markers"
          else
            echo "FAIL: comment-body missing expected diff markers"
            exit 1
          fi
