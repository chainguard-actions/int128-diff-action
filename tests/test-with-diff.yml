name: Test with diff (modified file)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create base and head directories with different content
        run: |
          mkdir -p /tmp/base /tmp/head
          echo "old content" > /tmp/base/file.txt
          echo "new content" > /tmp/head/file.txt

      - id: action
        uses: .
        with:
          base: /tmp/base
          head: /tmp/head

      - name: Assert comment-body contains diff info
        env:
          ACTUAL: ${{ steps.action.outputs.comment-body }}
        run: |
          echo "actual: '$ACTUAL'"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected non-empty comment-body when diff exists"
            exit 1
          fi
          # The comment body should mention "file changed" or "files changed"
          if ! echo "$ACTUAL" | grep -q "file"; then
            echo "FAIL: expected comment-body to mention 'file', got: $ACTUAL"
            exit 1
          fi
          echo "PASS: comment-body contains diff info"
