name: Test with diff (modified file)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create base and head directories with different content
        run: |
          mkdir -p /tmp/base /tmp/head
          echo "original content" > /tmp/base/file.txt
          echo "modified content" > /tmp/head/file.txt

      - id: action
        uses: .
        with:
          base: /tmp/base
          head: /tmp/head

      - name: Assert comment-body is non-empty (diff present)
        env:
          ACTUAL: ${{ steps.action.outputs.comment-body }}
        run: |
          echo "actual: '$ACTUAL'"
          NORM="$(echo "$ACTUAL" | tr -d '[:space:]')"
          if [ -z "$NORM" ] || [ "$NORM" = "{}" ] || [ "$NORM" = "null" ] \
             || echo "$ACTUAL" | grep -qiE 'no .*(change|diff)'; then
            echo "FAIL: expected a diff but got empty/no-diff: $ACTUAL"
            exit 1
          fi
          echo "PASS: diff present"

      - name: Assert comment-body contains 'file changed'
        env:
          ACTUAL: ${{ steps.action.outputs.comment-body }}
        run: |
          echo "actual: '$ACTUAL'"
          if echo "$ACTUAL" | grep -q "file"; then
            echo "PASS: comment-body mentions file changes"
          else
            echo "FAIL: expected 'file' in comment-body"
            exit 1
          fi
