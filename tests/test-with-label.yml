name: Test diff with label input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create base file
        run: |
          mkdir -p /tmp/diff-label-test/base
          echo "hello world" > /tmp/diff-label-test/base/file.txt

      - name: Create head file with changes
        run: |
          mkdir -p /tmp/diff-label-test/head
          echo "hello world" > /tmp/diff-label-test/head/file.txt
          echo "new line" >> /tmp/diff-label-test/head/file.txt

      - id: action
        uses: .
        with:
          base: /tmp/diff-label-test/base/file.txt
          head: /tmp/diff-label-test/head/file.txt
          label: diff-detected

      - name: Assert comment-body is non-empty (diff detected)
        env:
          ACTUAL: ${{ steps.action.outputs.comment-body }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected comment-body to be non-empty when diff is present"
            exit 1
          fi
          echo "PASS: comment-body is non-empty"
