name: Test with label input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create base file
        run: |
          echo "line1" > /tmp/base.txt
          echo "line2" >> /tmp/base.txt

      - name: Create head file with diff
        run: |
          echo "line1" > /tmp/head.txt
          echo "line2" >> /tmp/head.txt
          echo "line3" >> /tmp/head.txt

      - id: action
        uses: .
        continue-on-error: true
        with:
          base: /tmp/base.txt
          head: /tmp/head.txt
          label: diff-detected
          token: ${{ github.token }}

      - name: Assert action ran with label input
        env:
          OUTCOME: ${{ steps.action.outcome }}
          COMMENT_BODY: ${{ steps.action.outputs.comment-body }}
        run: |
          echo "outcome: $OUTCOME"
          echo "comment-body: $COMMENT_BODY"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with label input"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with label input (failed gracefully, likely due to sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
