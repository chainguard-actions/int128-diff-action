name: Test with label input (sentinel repo graceful failure)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create base and head directories with different content
        run: |
          mkdir -p /tmp/base-label /tmp/head-label
          echo "old content" > /tmp/base-label/file.txt
          echo "new content" > /tmp/head-label/file.txt

      - id: action
        uses: .
        continue-on-error: true
        with:
          base: /tmp/base-label
          head: /tmp/head-label
          label: manifest-changed

      - name: Assert action ran (diff computed or failed gracefully on sentinel repo)
        env:
          COMMENT_BODY: ${{ steps.action.outputs.comment-body }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "comment-body: '$COMMENT_BODY'"
          if [ "$OUTCOME" = "success" ]; then
            NORM="$(echo "$COMMENT_BODY" | tr -d '[:space:]')"
            if [ -z "$NORM" ] || [ "$NORM" = "{}" ] || [ "$NORM" = "null" ] \
               || echo "$COMMENT_BODY" | grep -qiE 'no .*(change|diff)'; then
              echo "FAIL: action succeeded but comment-body is empty despite diff existing"
              exit 1
            fi
            echo "PASS: diff present in comment-body"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo label API call not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
