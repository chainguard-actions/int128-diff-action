name: Test with label input (sentinel repo graceful handling)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create base and head directories with differences
        run: |
          mkdir -p /tmp/base-label /tmp/head-label
          echo "version: 1" > /tmp/base-label/config.yaml
          echo "version: 2" > /tmp/head-label/config.yaml

      - id: diff
        uses: .
        continue-on-error: true
        with:
          base: /tmp/base-label
          head: /tmp/head-label
          label: manifest-changed

      - name: Assert action ran (diff computed or failed gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.diff.outcome }}
          COMMENT_BODY: ${{ steps.diff.outputs.comment-body }}
        run: |
          echo "outcome: $OUTCOME"
          echo "comment-body (first 200 chars): ${COMMENT_BODY:0:200}"
          if [ "$OUTCOME" = "success" ]; then
            # If it succeeded, comment-body should be non-empty (we have a diff)
            NORM="$(echo "$COMMENT_BODY" | tr -d '[:space:]')"
            if [ -z "$NORM" ] || [ "$NORM" = "{}" ] || [ "$NORM" = "null" ] \
               || echo "$COMMENT_BODY" | grep -qiE 'no .*(change|diff)'; then
              echo "FAIL: action succeeded but comment-body is empty despite having a diff"
              exit 1
            fi
            echo "PASS: action succeeded with diff in comment-body"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (label API call failed on sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
