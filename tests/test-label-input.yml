name: Test diff with label input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create base and head directories with a modified file
        run: |
          mkdir -p /tmp/diff-label/base /tmp/diff-label/head
          echo "original content" > /tmp/diff-label/base/file.txt
          echo "modified content" > /tmp/diff-label/head/file.txt

      - id: action
        uses: .
        with:
          base: /tmp/diff-label/base
          head: /tmp/diff-label/head
          label: diff-detected
          token: ${{ github.token }}

      - name: Assert comment-body is non-empty when diff exists with label
        env:
          ACTUAL: ${{ steps.action.outputs.comment-body }}
        run: |
          echo "actual: '$ACTUAL'"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected non-empty comment-body when a file is modified"
            exit 1
          fi
          echo "PASS: comment-body is non-empty as expected when label input is provided"
