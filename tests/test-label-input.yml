name: Test label input (diff with label)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create base and head directories with different content
        run: |
          mkdir -p /tmp/label-test/base /tmp/label-test/head
          echo "version: 1.0.0" > /tmp/label-test/base/config.yaml
          echo "replicas: 2" >> /tmp/label-test/base/config.yaml
          echo "version: 2.0.0" > /tmp/label-test/head/config.yaml
          echo "replicas: 5" >> /tmp/label-test/head/config.yaml

      - id: action
        uses: .
        continue-on-error: true
        with:
          base: /tmp/label-test/base
          head: /tmp/label-test/head
          label: diff-detected

      - name: Assert action ran (comment-body set, or failed gracefully on sentinel repo for label ops)
        env:
          RESULT: ${{ steps.action.outputs.comment-body }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result: $RESULT"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$RESULT" ]; then
              echo "FAIL: action succeeded but comment-body is empty"
              exit 1
            fi
            echo "PASS: got non-empty comment-body: $RESULT"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo label API call not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
