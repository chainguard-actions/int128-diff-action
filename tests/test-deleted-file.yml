name: Test deleted file scenario
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create base and head directories where base has an extra file
        run: |
          mkdir -p /tmp/base-deleted /tmp/head-deleted
          echo "existing file" > /tmp/base-deleted/existing.txt
          echo "existing file" > /tmp/head-deleted/existing.txt
          echo "file to be deleted" > /tmp/base-deleted/removed.txt

      - id: action
        uses: .
        with:
          base: /tmp/base-deleted
          head: /tmp/head-deleted

      - name: Assert comment-body is non-empty when file is deleted
        env:
          ACTUAL: ${{ steps.action.outputs.comment-body }}
        run: |
          echo "actual: '$ACTUAL'"
          NORM="$(echo "$ACTUAL" | tr -d '[:space:]')"
          if [ -z "$NORM" ] || [ "$NORM" = "{}" ] || [ "$NORM" = "null" ] \
             || echo "$ACTUAL" | grep -qiE 'no .*(change|diff)'; then
            echo "FAIL: expected a diff for deleted file but got empty/no-diff: $ACTUAL"
            exit 1
          fi
          echo "PASS: diff present for deleted file"

      - name: Assert comment-body mentions the removed file
        env:
          ACTUAL: ${{ steps.action.outputs.comment-body }}
        run: |
          echo "actual: '$ACTUAL'"
          if echo "$ACTUAL" | grep -q "removed.txt"; then
            echo "PASS: comment-body references the deleted file"
          else
            echo "FAIL: expected comment-body to reference removed.txt"
            exit 1
          fi
