name: Test deleted file (file in base but not in head)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create base and head directories where base has an extra file
        run: |
          mkdir -p /tmp/deleted-base /tmp/deleted-head
          echo "common file" > /tmp/deleted-base/common.txt
          echo "common file" > /tmp/deleted-head/common.txt
          echo "file to be deleted" > /tmp/deleted-base/old-file.txt

      - id: action
        uses: .
        with:
          base: /tmp/deleted-base
          head: /tmp/deleted-head

      - name: Assert comment-body is non-empty when file is deleted
        env:
          ACTUAL: ${{ steps.action.outputs.comment-body }}
        run: |
          echo "actual: '$ACTUAL'"
          NORM="$(echo "$ACTUAL" | tr -d '[:space:]')"
          if [ -z "$NORM" ] || [ "$NORM" = "{}" ] || [ "$NORM" = "null" ] \
             || echo "$ACTUAL" | grep -qiE 'no .*(change|diff)'; then
            echo "FAIL: expected diff for deleted file but got empty/no-diff: $ACTUAL"
            exit 1
          fi
          echo "PASS: comment-body contains diff for deleted file"
