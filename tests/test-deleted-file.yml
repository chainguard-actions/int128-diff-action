name: Test deleted file (base has file missing from head)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create base and head directories where base has an extra file
        run: |
          mkdir -p /tmp/base-deleted /tmp/head-deleted
          echo "common file" > /tmp/base-deleted/common.txt
          echo "common file" > /tmp/head-deleted/common.txt
          echo "this file will be deleted" > /tmp/base-deleted/removed.txt

      - id: diff
        uses: .
        with:
          base: /tmp/base-deleted
          head: /tmp/head-deleted

      - name: Assert comment-body is non-empty when file is deleted
        env:
          ACTUAL: ${{ steps.diff.outputs.comment-body }}
        run: |
          echo "actual: '$ACTUAL'"
          NORM="$(echo "$ACTUAL" | tr -d '[:space:]')"
          if [ -z "$NORM" ] || [ "$NORM" = "{}" ] || [ "$NORM" = "null" ] \
             || echo "$ACTUAL" | grep -qiE 'no .*(change|diff)'; then
            echo "FAIL: expected a diff but got empty/no-diff: $ACTUAL"
            exit 1
          fi
          echo "PASS: diff present in comment-body"

      - name: Assert comment-body mentions deleted file
        env:
          ACTUAL: ${{ steps.diff.outputs.comment-body }}
        run: |
          echo "actual: '$ACTUAL'"
          if echo "$ACTUAL" | grep -qi "deleted\|\`D\`"; then
            echo "PASS: comment-body mentions deleted file"
          else
            echo "FAIL: expected 'deleted' or 'D' marker in comment-body"
            exit 1
          fi
