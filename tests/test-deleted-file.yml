name: Test deleted file (base has file missing from head)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create base and head directories where base has an extra file
        run: |
          mkdir -p /tmp/base /tmp/head
          echo "existing file" > /tmp/base/existing.txt
          echo "existing file" > /tmp/head/existing.txt
          echo "file to be deleted" > /tmp/base/deleted.txt

      - id: action
        uses: .
        with:
          base: /tmp/base
          head: /tmp/head

      - name: Assert comment-body mentions deleted file
        env:
          ACTUAL: ${{ steps.action.outputs.comment-body }}
        run: |
          echo "actual: '$ACTUAL'"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected non-empty comment-body when a file was deleted"
            exit 1
          fi
          # The comment body should mention "deleted" (status D)
          if ! echo "$ACTUAL" | grep -qi "deleted\|\`D\`"; then
            echo "FAIL: expected comment-body to mention deleted file, got: $ACTUAL"
            exit 1
          fi
          echo "PASS: comment-body mentions deleted file"
