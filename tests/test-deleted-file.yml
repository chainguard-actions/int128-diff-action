name: Test deleted file (file in base but not in head)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create base and head directories where base has an extra file
        run: |
          mkdir -p /tmp/base-del /tmp/head-del
          echo "common file" > /tmp/base-del/common.txt
          echo "common file" > /tmp/head-del/common.txt
          echo "file to be deleted" > /tmp/base-del/deleted.txt

      - id: diff
        uses: .
        with:
          base: /tmp/base-del
          head: /tmp/head-del
          token: ${{ github.token }}

      - name: Assert comment-body is non-empty when file is deleted
        env:
          ACTUAL: ${{ steps.diff.outputs.comment-body }}
        run: |
          echo "actual: '$ACTUAL'"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected non-empty comment-body for deleted file"
            exit 1
          fi
          echo "PASS: comment-body is non-empty as expected"

      - name: Assert comment-body references the deleted file
        env:
          ACTUAL: ${{ steps.diff.outputs.comment-body }}
        run: |
          echo "actual: '$ACTUAL'"
          if ! echo "$ACTUAL" | grep -q "deleted.txt"; then
            echo "FAIL: expected comment-body to reference deleted.txt"
            exit 1
          fi
          echo "PASS: comment-body references the deleted file"
