name: Test no diff (identical files)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create identical base and head files
        run: |
          mkdir -p /tmp/diff-test/base /tmp/diff-test/head
          echo "hello world" > /tmp/diff-test/base/file.txt
          echo "hello world" > /tmp/diff-test/head/file.txt

      - id: action
        uses: .
        with:
          base: /tmp/diff-test/base
          head: /tmp/diff-test/head

      - name: Assert comment-body is empty when no diff
        env:
          ACTUAL: ${{ steps.action.outputs.comment-body }}
        run: |
          echo "actual: '$ACTUAL'"
          NORM="$(echo "$ACTUAL" | tr -d '[:space:]')"
          if [ -z "$NORM" ] || [ "$NORM" = "{}" ] || [ "$NORM" = "null" ] \
             || echo "$ACTUAL" | grep -qiE 'no .*(change|diff)'; then
            echo "PASS: no diff as expected (comment-body is empty)"
          else
            echo "FAIL: expected empty comment-body but got: $ACTUAL"
            exit 1
          fi
