name: Test no diff (identical base and head)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create identical base and head directories
        run: |
          mkdir -p /tmp/diff-test/base /tmp/diff-test/head
          echo "hello world" > /tmp/diff-test/base/file.txt
          echo "hello world" > /tmp/diff-test/head/file.txt

      - id: action
        uses: .
        with:
          base: /tmp/diff-test/base
          head: /tmp/diff-test/head
          token: ${{ github.token }}

      - name: Assert comment-body is empty when no diff
        env:
          ACTUAL: ${{ steps.action.outputs.comment-body }}
        run: |
          echo "actual: '$ACTUAL'"
          if [ -n "$ACTUAL" ]; then
            echo "FAIL: expected empty comment-body when no diff, got: $ACTUAL"
            exit 1
          fi
          echo "PASS: comment-body is empty as expected"
