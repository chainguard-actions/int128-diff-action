name: Test modified file diff
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up base and head directories with a modified file
        run: |
          mkdir -p /tmp/base-modified /tmp/head-modified
          echo "original content" > /tmp/base-modified/config.txt
          echo "updated content" > /tmp/head-modified/config.txt

      - id: diff
        uses: .
        with:
          base: /tmp/base-modified
          head: /tmp/head-modified

      - name: Assert comment-body is non-empty and mentions changed file
        env:
          COMMENT_BODY: ${{ steps.diff.outputs.comment-body }}
        run: |
          echo "comment-body: '$COMMENT_BODY'"
          NORM="$(echo "$COMMENT_BODY" | tr -d '[:space:]')"
          if [ -z "$NORM" ] || [ "$NORM" = "{}" ] || [ "$NORM" = "null" ] \
             || echo "$COMMENT_BODY" | grep -qiE 'no .*(change|diff)'; then
            echo "FAIL: expected a diff but got empty/no-diff: $COMMENT_BODY"
            exit 1
          fi
          echo "PASS: diff present in comment-body"

      - name: Assert comment-body mentions files changed
        env:
          COMMENT_BODY: ${{ steps.diff.outputs.comment-body }}
        run: |
          echo "comment-body: '$COMMENT_BODY'"
          if echo "$COMMENT_BODY" | grep -q "file"; then
            echo "PASS: comment-body mentions 'file'"
          else
            echo "FAIL: expected 'file' in comment-body"
            exit 1
          fi
