name: Test added file scenario
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create base and head directories where head has an extra file
        run: |
          mkdir -p /tmp/base-added /tmp/head-added
          echo "existing file" > /tmp/base-added/existing.txt
          echo "existing file" > /tmp/head-added/existing.txt
          echo "brand new file" > /tmp/head-added/newfile.txt

      - id: action
        uses: .
        with:
          base: /tmp/base-added
          head: /tmp/head-added

      - name: Assert comment-body is non-empty when file is added
        env:
          ACTUAL: ${{ steps.action.outputs.comment-body }}
        run: |
          echo "actual: '$ACTUAL'"
          NORM="$(echo "$ACTUAL" | tr -d '[:space:]')"
          if [ -z "$NORM" ] || [ "$NORM" = "{}" ] || [ "$NORM" = "null" ] \
             || echo "$ACTUAL" | grep -qiE 'no .*(change|diff)'; then
            echo "FAIL: expected a diff for added file but got empty/no-diff: $ACTUAL"
            exit 1
          fi
          echo "PASS: diff present for added file"

      - name: Assert comment-body mentions the new file
        env:
          ACTUAL: ${{ steps.action.outputs.comment-body }}
        run: |
          echo "actual: '$ACTUAL'"
          if echo "$ACTUAL" | grep -q "newfile.txt"; then
            echo "PASS: comment-body references the added file"
          else
            echo "FAIL: expected comment-body to reference newfile.txt"
            exit 1
          fi
