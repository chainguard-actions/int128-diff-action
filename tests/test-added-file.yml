name: Test added file (file in head but not base)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create base (empty) and head (with new file) directories
        run: |
          mkdir -p /tmp/base-added /tmp/head-added
          echo "new file content" > /tmp/head-added/newfile.txt

      - id: action
        uses: .
        with:
          base: /tmp/base-added
          head: /tmp/head-added

      - name: Assert comment-body is non-empty (added file detected)
        env:
          ACTUAL: ${{ steps.action.outputs.comment-body }}
        run: |
          echo "actual: '$ACTUAL'"
          NORM="$(echo "$ACTUAL" | tr -d '[:space:]')"
          if [ -z "$NORM" ] || [ "$NORM" = "{}" ] || [ "$NORM" = "null" ] \
             || echo "$ACTUAL" | grep -qiE 'no .*(change|diff)'; then
            echo "FAIL: expected a diff for added file but got empty/no-diff: $ACTUAL"
            exit 1
          fi
          echo "PASS: diff present for added file"

      - name: Assert comment-body mentions added status
        env:
          ACTUAL: ${{ steps.action.outputs.comment-body }}
        run: |
          echo "actual: '$ACTUAL'"
          if echo "$ACTUAL" | grep -qiE 'added|`A`'; then
            echo "PASS: comment-body mentions added file"
          else
            echo "FAIL: expected 'added' or 'A' marker in comment-body"
            exit 1
          fi
