name: Test added file (head has new file)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create base and head directories where head has an extra file
        run: |
          mkdir -p /tmp/base /tmp/head
          echo "existing file" > /tmp/base/existing.txt
          echo "existing file" > /tmp/head/existing.txt
          echo "brand new file" > /tmp/head/newfile.txt

      - id: action
        uses: .
        with:
          base: /tmp/base
          head: /tmp/head

      - name: Assert comment-body mentions added file
        env:
          ACTUAL: ${{ steps.action.outputs.comment-body }}
        run: |
          echo "actual: '$ACTUAL'"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected non-empty comment-body when a file was added"
            exit 1
          fi
          # The comment body should mention "added" (status A)
          if ! echo "$ACTUAL" | grep -qi "added\|` A`\|\`A\`"; then
            echo "FAIL: expected comment-body to mention added file, got: $ACTUAL"
            exit 1
          fi
          echo "PASS: comment-body mentions added file"
